# BEGIN pizu.pl naglowki — wstawia scripts/deploy.mjs (repozytorium pizu-pl) przy każdym wdrożeniu, nie edytuj tutaj
# strona błędu z marką Pizu zamiast ogólnej strony hostingu (źródło: shell/404.html)
ErrorDocument 404 /404.html
<IfModule mod_headers.c>
  Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set X-Frame-Options "DENY"
  Header always set Cross-Origin-Opener-Policy "same-origin"
  <FilesMatch "\.html$">
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
  </FilesMatch>
</IfModule>
# END pizu.pl naglowki
