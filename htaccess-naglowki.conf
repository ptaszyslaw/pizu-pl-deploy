# BEGIN pizu.pl naglowki — wstawia scripts/deploy.mjs (repozytorium ptaszynski-pl) przy każdym wdrożeniu, nie edytuj tutaj
<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set X-Frame-Options "DENY"
  <FilesMatch "\.html$">
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
  </FilesMatch>
</IfModule>
# END pizu.pl naglowki
